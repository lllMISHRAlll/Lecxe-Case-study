<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Flow Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Layout: sticky tab bar over one reading column; each tab is a top-to-bottom flowchart. */
  :root {
    --bg: #f4f5f8; --surface: #ffffff; --ink: #151a24; --muted: #5a6475; --line: #dde1ea;
    --accent: #3a4bd6; --accent-soft: #e7eafc;
    --llm: #b8520a; --llm-bg: #fdeedf;
    --tool: #0c7a52; --tool-bg: #dff4ea;
    --code: #36588f; --code-bg: #e6edf8;
    --hybrid: #0b7188; --hybrid-bg: #dbf1f6;
    --agent: #5a3dcc; --agent-bg: #ebe7fa;
    --warn: #9a6200; --warn-bg: #fdf1d6;
    --bad: #b3261e; --bad-bg: #fde7e5;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f131b; --surface: #171c27; --ink: #e8ecf4; --muted: #9aa5b8; --line: #2a3242;
      --accent: #8c9bff; --accent-soft: #232a4d;
      --llm: #ffa45c; --llm-bg: #3a2616;
      --tool: #4fd3a0; --tool-bg: #14352a;
      --code: #8fb2ee; --code-bg: #1f2d47;
      --hybrid: #5ccfe6; --hybrid-bg: #12333b;
      --agent: #b6a2ff; --agent-bg: #2a2150;
      --warn: #f0b94a; --warn-bg: #3a2d10;
      --bad: #ff8f86; --bad-bg: #3d1a18;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f131b; --surface: #171c27; --ink: #e8ecf4; --muted: #9aa5b8; --line: #2a3242;
    --accent: #8c9bff; --accent-soft: #232a4d;
    --llm: #ffa45c; --llm-bg: #3a2616;
    --tool: #4fd3a0; --tool-bg: #14352a;
    --code: #8fb2ee; --code-bg: #1f2d47;
    --hybrid: #5ccfe6; --hybrid-bg: #12333b;
    --agent: #b6a2ff; --agent-bg: #2a2150;
    --warn: #f0b94a; --warn-bg: #3a2d10;
    --bad: #ff8f86; --bad-bg: #3d1a18;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 56px;
  }
  code, .mono { font-family: var(--mono); font-size: 0.92em; }
  .wrap { max-width: 980px; margin: 0 auto; }
  header.top { padding: 28px 0 8px; }
  header.top h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
  header.top p { margin: 0; color: var(--muted); max-width: 72ch; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 16px 0 4px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .legend > div { display: flex; align-items: center; gap: 6px; color: var(--muted); }

  .tabbar-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)) 0; border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .tabbar { display: flex; gap: 4px; overflow-x: auto; max-width: 980px; margin: 0 auto; scrollbar-width: thin; }
  .tab { appearance: none; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--muted); font: inherit; font-weight: 500; font-size: 14px; padding: 9px 14px; border-radius: 9px 9px 0 0; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .tab:hover { color: var(--ink); background: var(--accent-soft); }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--line); box-shadow: 0 1px 0 var(--surface); position: relative; top: 1px; }
  .tab:focus-visible, .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab .n { font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 99px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
  .pill { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 99px; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pills-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); align-self: center; margin-right: 2px; }

  .scn-head { margin: 22px 0 14px; display: grid; gap: 14px; }
  .qbox { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 16px; }
  .qbox .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
  .qbox .q { font-family: var(--mono); font-size: 15px; margin: 4px 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qbox .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
  .qbox .meta b { color: var(--ink); font-weight: 600; }
  .qbox p { margin: 8px 0 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat.llm .v { color: var(--llm); } .stat.tool .v { color: var(--tool); } .stat.skip .v { color: var(--muted); } .stat.save .v { color: var(--accent); }

  .seq { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .seq h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
  .chip .i { color: var(--muted); font-size: 11px; }
  .chip.t-llm { border-color: var(--llm); } .chip.t-tool { border-color: var(--tool); } .chip.t-code { border-color: var(--code); } .chip.t-hybrid { border-color: var(--hybrid); } .chip.t-agent { border-color: var(--agent); }
  .chip.sub { background: var(--llm-bg); color: var(--llm); border-color: var(--llm); }
  .arrow { color: var(--muted); font-size: 12px; }
  .seq .note { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }

  .stage { margin-top: 26px; }
  .stage > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin: 0 0 10px; font-weight: 700; }
  .path { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; text-transform: uppercase; }
  .steps { display: grid; gap: 10px; position: relative; }

  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .tag.t-llm { color: var(--llm); background: var(--llm-bg); } .tag.t-tool { color: var(--tool); background: var(--tool-bg); }
  .tag.t-code { color: var(--code); background: var(--code-bg); } .tag.t-hybrid { color: var(--hybrid); background: var(--hybrid-bg); } .tag.t-agent { color: var(--agent); background: var(--agent-bg); }
  .st { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .st.ran { color: var(--tool); background: var(--tool-bg); } .st.skip { color: var(--muted); background: var(--line); }
  .ls { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  .node { background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .node.t-llm { border-left-color: var(--llm); } .node.t-tool { border-left-color: var(--tool); } .node.t-code { border-left-color: var(--code); } .node.t-hybrid { border-left-color: var(--hybrid); } .node.t-agent { border-left-color: var(--agent); }
  .node .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .num { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .nm { font-family: var(--mono); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .what { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .here { margin: 8px 0 0; padding: 8px 10px; background: var(--accent-soft); border-radius: 8px; font-size: 14px; }
  .here b { color: var(--accent); font-weight: 700; }
  .here ol { margin: 4px 0 0; padding-left: 20px; }
  .inner { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .inner li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); }
  .inner li.ran { background: var(--bg); } .inner li.skip { border-style: dashed; color: var(--muted); }
  .inner li .lab { font-family: var(--mono); font-weight: 600; }
  .inner li.ran.k-llm { border-color: var(--llm); } .inner li.ran.k-llm .lab { color: var(--llm); }
  .inner .tier { font-size: 11px; color: var(--muted); }
  .file { margin: 8px 0 0; font-size: 12px; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }

  .node.skipped { background: transparent; border-style: dashed; border-left-style: dashed; padding: 9px 14px; opacity: 0.88; }
  .node.skipped .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .node.skipped .why { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
  .node.skipped .why b { color: var(--ink); font-weight: 600; }

  .group { border: 1px solid var(--agent); border-radius: 12px; padding: 12px; background: color-mix(in srgb, var(--agent-bg) 35%, transparent); display: grid; gap: 10px; }
  .group.skipped { border-style: dashed; border-color: var(--line); background: transparent; }
  .group > .ghd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .group .gnote { margin: 0; font-size: 14px; color: var(--muted); }
  .group .gnote b { color: var(--ink); }
  .group.skipped .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

  .callouts { display: grid; gap: 10px; margin-top: 26px; }
  .callout { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); }
  .callout h4 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0.03em; }
  .callout p { margin: 0; font-size: 14px; }
  .callout.warn { background: var(--warn-bg); border-color: transparent; } .callout.warn h4 { color: var(--warn); }
  .callout.say { background: var(--accent-soft); border-color: transparent; } .callout.say h4 { color: var(--accent); }
  .callout ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
  .callout li + li { margin-top: 3px; }

  .sheet h2 { font-size: 20px; margin: 30px 0 10px; letter-spacing: -0.005em; }
  .sheet h2:first-child { margin-top: 22px; }
  .sheet .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .sheet .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .sheet .card h4 { margin: 0 0 4px; font-size: 14px; }
  .sheet .card p, .sheet .card li { font-size: 14px; color: var(--muted); margin: 0; }
  .sheet .card ul { margin: 0; padding-left: 18px; }
  .sheet table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .sheet th, .sheet td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .sheet th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); background: var(--bg); }
  .tablewrap { overflow-x: auto; border-radius: 10px; }
  .qa { display: grid; gap: 8px; }
  .qa details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .qa summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
  .qa details[open] summary { margin-bottom: 6px; }
  .qa p { margin: 0; font-size: 14px; color: var(--muted); }
  .theme { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 18px; }
  @media (prefers-reduced-motion: no-preference) { .tab, .pill { transition: background 0.15s, color 0.15s; } }
  @media (max-width: 520px) { .node { padding: 10px 12px; } .tab { padding: 8px 11px; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Agent Flow Playbook</h1>
    <p>How the Procurement Assistant handles each kind of message. Pick a tab, then follow the numbered steps top to bottom. Every node of the graph is listed on every tab: <b>RAN</b> with what it did, or <b>SKIPPED</b> with the reason.</p>
    <div class="legend" id="legend"></div>
  </header>
  <div class="tabbar-wrap"><div class="tabbar" id="tabs" role="tablist" aria-label="Question types"></div></div>
  <main id="view" aria-live="polite"></main>
</div>

<script>
/* ---------- tags ---------- */
const TYPES = {
  agent:  { label: "AGENT",       glyph: "▣", help: "A sub-graph that owns several steps (sql_agent, po_flow). The root chat_turn is the orchestrator." },
  llm:    { label: "LLM CALL",    glyph: "◆", help: "The step exists to call a model. Fast tier = small cheap model, strong tier = bigger model." },
  tool:   { label: "TOOL",        glyph: "⚙", help: "Plain code that reads or writes the database or applies fixed business rules. No model." },
  code:   { label: "CODE",        glyph: "{ }", help: "Deterministic logic or guardrail in Python. No model, no database." },
  hybrid: { label: "RULES + LLM", glyph: "⑂", help: "Cheap rules run first; a model is called only if the rules cannot decide." },
};
const LS_TOOLS = new Set(["load_canned_sql","execute_sql","reduce_results","check_po_permission","save_history","validate_sql","load_draft","save_draft","insert_po","cancel"]);

/* ---------- node catalogue (what each step is, independent of the question) ---------- */
const NODES = {
  preprocess: { t: "code", file: "agents/nodes/main.py", what: "Cleans the incoming text: Unicode normalise, strip control characters, collapse spaces but keep line breaks, mask emails / phones / secrets, reject empty or over 1000 characters. For a button or PO action it just turns the button label into the question." },
  guard_input: { t: "hybrid", file: "agents/nodes/main.py · guardrails/injection.py", what: "Safety gate for typed messages. Layer 1: about 25 regex rules (prompt injection, destructive or raw SQL, markup, base64-hidden text). Layer 2: a small LLM classifier for subtler attacks. A blocked message ends the turn right here.",
    inner: [{ k: "rules", kind: "rule", label: "regex rules" }, { k: "llm", kind: "llm", label: "llm.guard", tier: "fast" }] },
  rewrite_followup: { t: "hybrid", file: "agents/routing/rewriter.py", what: "Turns a follow-up such as “and last month?” into a standalone question using the last 3 turns. A regex decides whether the message even looks like a follow-up; only then is the model called.",
    inner: [{ k: "gate", kind: "rule", label: "follow-up check (history + regex)" }, { k: "llm", kind: "llm", label: "llm.rewrite", tier: "fast" }] },
  route_intent: { t: "hybrid", file: "agents/routing/router.py", what: "Decides the path: saved query, data question, raise PO, small talk or unclear. Rules first (button, PO phrases, small talk, open-draft replies); the model classifies only what the rules miss. Confidence under 0.6 becomes “unclear”.",
    inner: [{ k: "rules", kind: "rule", label: "routing rules" }, { k: "llm", kind: "llm", label: "llm.route", tier: "fast" }] },
  load_canned_sql: { t: "tool", file: "agents/nodes/main.py · sql/canned.py", what: "Looks up the pre-written SQL behind a suggested-question button, checks it is allowed for this role, and fills its parameters (today’s date, USD to INR rate). Sends the SQL to the SQL panel in the UI." },
  sql_agent: { t: "agent", file: "agents/sql_agent/graph.py", what: "Turns a free-text question into one safe SELECT: link tables, write SQL, validate, fix if needed (up to 3 attempts)." },
  schema_link: { t: "llm", file: "agents/sql_agent/nodes.py", what: "Asks the strong model which tables answer the question, from only the tables this role may see. Can say “not answerable”, which ends the turn.",
    inner: [{ k: "llm", kind: "llm", label: "llm.schema_link", tier: "strong" }] },
  generate_sql: { t: "llm", file: "agents/sql_agent/nodes.py", what: "The strong model writes the SQL from the linked schema, value hints (real vendor names), examples from saved queries, today’s date and the FX rate.",
    inner: [{ k: "llm", kind: "llm", label: "llm.generate_sql", tier: "strong" }] },
  validate_sql: { t: "tool", file: "agents/sql_agent/nodes.py · sql/validator.py", what: "Never trusts the model. Parses the SQL: exactly one SELECT, no comments, no SELECT *, only tables this role may read, LIMIT at most 500. Then EXPLAIN on the database rejects queries that are too costly or reference missing columns." },
  fix_sql: { t: "llm", file: "agents/sql_agent/nodes.py", what: "Gives the strong model the failing SQL and the exact error and asks for a corrected query. Counts as the next attempt.",
    inner: [{ k: "llm", kind: "llm", label: "llm.fix_sql", tier: "strong" }] },
  check_po_permission: { t: "tool", file: "agents/nodes/main.py · rbac/capabilities.py", what: "RBAC check: only the Procurement Manager holds the PO-create capability. Other roles get a fixed refusal and the turn ends before the PO agent starts." },
  po_flow: { t: "agent", file: "agents/po_flow/graph.py", what: "A multi-turn state machine that builds a PO draft in the database, asks for what is missing, shows a confirmation card and finally inserts the PO. No model-written SQL anywhere in it." },
  load_draft: { t: "tool", file: "agents/po_flow/nodes.py", what: "Reads the open draft for this conversation from assistant.po_drafts (or starts a new one) and decides the action: extract, choose, confirm, cancel." },
  extract_slots: { t: "llm", file: "agents/po_flow/nodes.py · po/slots.py · po/resolver.py", what: "The fast model reads vendor, items, quantities, prices, terms and dates from the message (one entry per item). Code then fuzzy-matches each name against the live catalogue; a unique match fills the draft, an ambiguous one becomes a question.",
    inner: [{ k: "llm", kind: "llm", label: "llm.po_extract", tier: "fast" }, { k: "resolver", kind: "rule", label: "catalogue matching (rapidfuzz)" }] },
  choose: { t: "code", file: "agents/po_flow/nodes.py", what: "Applies the option the user picked from the buttons (vendor, item, payment terms). Several items can be picked at once. Then loads the next queued question, if any." },
  review_draft: { t: "tool", file: "agents/po_flow/nodes.py · po/rules.py", what: "Fills defaults (vendor’s usual payment terms, today’s date), suggests the last paid price per item, and works out what is still missing or invalid." },
  ask_choice: { t: "code", file: "agents/po_flow/nodes.py", what: "Something could not be matched or was ambiguous. Shows buttons (checkboxes plus Submit when several items fit) and queues any further questions behind this one." },
  ask_next_slot: { t: "code", file: "agents/po_flow/nodes.py · po/rules.py", what: "Asks for the next missing field, grouped where possible: vendor, quantities, prices, payment terms." },
  show_confirmation: { t: "code", file: "agents/po_flow/nodes.py", what: "The draft is complete. Sends the PO card (lines, totals, warnings) to the UI with Confirm, Edit and Cancel." },
  save_draft: { t: "tool", file: "agents/po_flow/nodes.py · history/repository.py", what: "Saves the draft back to assistant.po_drafts so the next message continues from it." },
  insert_po: { t: "tool", file: "agents/po_flow/nodes.py · po/repository.py", what: "The only write to company tables. Fixed parameterised insert through PORepository, never model-written SQL. An idempotency key makes a repeated Confirm return the same PO. Closes the draft and sends po_created." },
  cancel: { t: "tool", file: "agents/po_flow/nodes.py", what: "Closes the draft as cancelled. Nothing is written to the company tables." },
  no_draft: { t: "code", file: "agents/po_flow/nodes.py", what: "Confirm, choose or cancel arrived but there is no open draft. Replies with a fixed message." },
  chat: { t: "code", file: "agents/nodes/main.py", what: "Marks the turn as small talk. The actual reply is written by the reply node." },
  ask_clarify: { t: "code", file: "agents/nodes/main.py", what: "The request was too vague to route. Sets a fixed message asking for more detail, with examples." },
  execute_sql: { t: "tool", file: "agents/nodes/main.py · sql/executor.py", what: "Runs the SQL on the read-only connection with a 5 s statement timeout and a 500-row cap. Sends the rows to the table in the UI. On a runtime error a typed question goes back to sql_agent to be fixed; a saved query just shows an error." },
  reduce_results: { t: "tool", file: "agents/nodes/main.py · viz/reducer.py", what: "Shrinks the rows into a short summary (top rows, counts, columns) so the model never sees the full table. Adds notes such as the FX rate or the latest data date when the result is empty." },
  choose_chart: { t: "hybrid", file: "agents/nodes/main.py · viz/chart_rules.py", what: "Picks bar, line, pie, scatter or table. Order of decision: the saved query’s own chart hint, then fixed rules based on column types, and only then a model.",

/* ---------- rendering ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const tag = (t) => `<span class="tag t-${t}" title="${esc(TYPES[t].help)}"><span aria-hidden="true">${TYPES[t].glyph}</span> ${TYPES[t].label}</span>`;
const lsTag = (id) => { const t = NODES[id].t; const k = t === "agent" ? "agent" : LS_TOOLS.has(id) ? "tool" : "node"; return `<span class="ls" title="How LangSmith labels this run">LangSmith: ${k}</span>`; };

function leafIds(variant) {
  const out = [];
  STAGES.forEach((st) => st.blocks.forEach((b) => b.ids.forEach((id) => {
    out.push(id);
    if (GROUPS[id] && variant.steps[id] && variant.steps[id].s === "ran") out.push(...GROUPS[id]);
  })));
  return out;
}
function validate(variant) {
  const problems = [];
  leafIds(variant).forEach((id) => {
    const st = variant.steps[id];
    if (!st) { problems.push(`missing step ${id}`); return; }
    const inner = NODES[id].inner || [];
    if (st.s === "ran") inner.forEach((i) => { if (!(i.k in st.inn)) problems.push(`${id}.${i.k} not described`); });
  });
  variant.seq.flat().forEach((id) => { if (!NODES[id]) problems.push(`unknown seq id ${id}`); else if (variant.steps[id] && variant.steps[id].s !== "ran") problems.push(`${id} is in seq but marked skipped`); });
  const ranIds = leafIds(variant).filter((id) => variant.steps[id] && variant.steps[id].s === "ran");
  ranIds.forEach((id) => { if (!variant.seq.flat().includes(id)) problems.push(`${id} ran but is not in seq`); });
  return problems;
}
function stats(variant) {
  let llm = 0, tool = 0, skipped = 0, llmSaved = 0;
  leafIds(variant).forEach((id) => {
    const st = variant.steps[id]; if (!st) return;
    if (st.s === "skip") { skipped++; return; }
    const n = st.notes.length;
    if (NODES[id].t === "tool") tool += n;
    (NODES[id].inner || []).forEach((i) => { if (i.kind !== "llm") return; if (typeof st.inn[i.k] === "string") llm += n; else llmSaved++; });
  });
  STAGES.forEach((s) => s.blocks.forEach((b) => b.ids.forEach((id) => { if (GROUPS[id] && variant.steps[id] && variant.steps[id].s === "skip") { skipped += GROUPS[id].length; GROUPS[id].forEach((c) => (NODES[c].inner || []).forEach((i) => { if (i.kind === "llm") llmSaved++; })); } })));
  return { llm, tool, skipped, llmSaved };
}
function numbering(variant) {
  const first = {}; let n = 0; const flat = [];
  variant.seq.forEach((item) => (Array.isArray(item) ? item : [item]).forEach((id) => { if (!(id in first)) first[id] = ++n; flat.push(id); }));
  return first;
}
function innerHTML(id, st) {
  const inner = NODES[id].inner; if (!inner || !inner.length) return "";
  return `<ul class="inner">${inner.map((i) => {
    const v = st.inn[i.k]; const skipped = typeof v === "object" && v && v.skip;
    const glyph = i.kind === "llm" ? "◆" : "·";
    const tier = i.tier ? `<span class="tier">${i.tier} model</span>` : "";
    const label = `<span class="lab">${esc(i.label)}</span>`;
    if (skipped) return `<li class="skip k-${i.kind}"><span class="st skip">SKIPPED</span> ${glyph} ${label} ${tier}<span>${fmt(v.skip)}</span></li>`;
    return `<li class="ran k-${i.kind}"><span class="st ran">${i.kind === "llm" ? "CALLED" : "RAN"}</span> ${glyph} ${label} ${tier}<span>${fmt(v || "")}</span></li>`;
  }).join("")}</ul>`;
}
function nodeHTML(id, st, nums) {
  const n = NODES[id];
  if (!st) return `<div class="node t-${n.t}"><code class="nm">${id}</code> (not described)</div>`;
  if (st.s === "skip") return `<div class="node skipped t-${n.t}"><div class="hd"><span class="num" style="background:var(--line);color:var(--muted)">–</span><code class="nm">${id}</code>${tag(n.t)}<span class="st skip">SKIPPED</span></div><p class="why"><b>Why:</b> ${fmt(st.why)}</p></div>`;
  const runs = st.notes.length > 1 ? `<span class="st ran">RAN ×${st.notes.length}</span>` : `<span class="st ran">RAN</span>`;
  const here = st.notes.length > 1 ? `<ol>${st.notes.map((x) => `<li>${fmt(x)}</li>`).join("")}</ol>` : fmt(st.notes[0]);
  return `<article class="node t-${n.t}"><div class="hd"><span class="num">${nums[id] || "?"}</span><code class="nm">${id}</code>${tag(n.t)}${runs}${lsTag(id)}</div>
    <p class="what">${fmt(n.what)}</p><div class="here"><b>In this query:</b> ${here}</div>${innerHTML(id, st)}<p class="file">${esc(n.file)}</p></article>`;
}
function groupHTML(id, variant, nums) {
  const st = variant.steps[id], n = NODES[id];
  if (!st || st.s === "skip") {
    return `<div class="group skipped"><div class="ghd"><span class="num" style="background:var(--line);color:var(--muted)">–</span><code class="nm">${id}</code>${tag("agent")}<span class="st skip">SKIPPED</span></div>
      <p class="gnote"><b>Why:</b> ${fmt(st ? st.why : "not described")}</p>
      <div class="chips">${GROUPS[id].map((c) => `<span class="chip t-${NODES[c].t}">${c}</span>`).join("")}</div></div>`;
  }
  return `<div class="group"><div class="ghd"><span class="num">${nums[id] || "?"}</span><code class="nm">${id}</code>${tag("agent")}<span class="st ran">RAN</span>${lsTag(id)}</div>
    <p class="gnote">${fmt(n.what)} <b>In this query:</b> ${fmt(st.notes[0])}</p>
    <div class="steps">${GROUPS[id].map((c) => nodeHTML(c, variant.steps[c], nums)).join("")}</div><p class="file">${esc(n.file)}</p></div>`;
}
function seqHTML(variant) {
  const parts = []; let n = 0;
  const chip = (id) => {
    n++; const st = variant.steps[id]; const subs = [];
    (NODES[id].inner || []).forEach((i) => { if (i.kind === "llm" && st && st.s === "ran" && typeof st.inn[i.k] === "string") subs.push(`<span class="chip sub">◆ ${i.label}</span>`); });
    return `<span class="chip t-${NODES[id].t}"><span class="i">${n}</span>${id}</span>${subs.join("")}`;
  };
  variant.seq.forEach((item) => { parts.push(Array.isArray(item) ? `<span class="chip" style="border-style:dashed">${item.map(chip).join(' <span class="arrow">∥</span> ')}</span>` : chip(item)); });
  return parts.join(' <span class="arrow">→</span> ');
}
function variantHTML(variant) {
  const nums = numbering(variant), s = stats(variant), probs = validate(variant);
  if (probs.length && typeof console !== "undefined") console.error("Scenario problems", variant.label, probs);
  const stages = STAGES.map((st) => `<section class="stage"><h3>${st.title}</h3>${st.blocks.map((b) => `${b.path ? `<div class="path">${b.path}</div>` : ""}<div class="steps">${b.ids.map((id) => GROUPS[id] ? groupHTML(id, variant, nums) : nodeHTML(id, variant.steps[id], nums)).join("")}</div>`).join("")}</section>`).join("");
  return `<div class="scn-head">
    <div class="qbox"><div class="lbl">User message</div><div class="q">${esc(variant.query)}</div>
      <div class="meta"><span>Role: <b>${esc(variant.role)}</b></span><span>User sees: <b>${esc(variant.result)}</b></span></div><p>${fmt(variant.summary)}</p></div>
    <div class="stats"><div class="stat llm"><div class="v">${s.llm}</div><div class="k">LLM calls made</div></div><div class="stat save"><div class="v">${s.llmSaved}</div><div class="k">LLM calls avoided by rules</div></div>
      <div class="stat tool"><div class="v">${s.tool}</div><div class="k">tool runs (DB / business rules)</div></div><div class="stat skip"><div class="v">${s.skipped}</div><div class="k">steps skipped</div></div></div>
    <div class="seq"><h4>Actual execution order</h4><div class="chips">${seqHTML(variant)}</div><p class="note">${fmt(variant.seqNote)} Orange chips are model calls.</p></div></div>
    ${stages}
    <div class="callouts">${variant.callouts.map((c) => `<div class="callout ${c.k}"><h4>${esc(c.h)}</h4><p>${fmt(c.b)}</p></div>`).join("")}</div>`;
}

  <tr><td>Role-scoped schema</td><td>Model only sees tables the role may read</td></tr>
  <tr><td><code>validate_sql</code></td><td>Anything but one SELECT, comments, SELECT *, forbidden tables, LIMIT above 500, expensive plans</td></tr>
  <tr><td>Database connection</td><td>Read-only transaction, 5 s statement timeout, row cap 500</td></tr>
  <tr><td><code>check_answer</code></td><td>Numbers in the answer that are not in the data</td></tr>
  <tr><td><code>check_po_permission</code></td><td>Roles without PO-create; checked at the start and again at Confirm</td></tr>
  <tr><td>LangSmith masking</td><td>Result rows removed, personal data masked, users shown as role plus a hash</td></tr>
</tbody></table></div>
<h2>Numbers worth remembering</h2>
<div class="grid">
  <div class="card"><h4>Model tiers</h4><ul><li>Fast tier: guard, rewrite, route, chart, PO extract, chat reply</li><li>Strong tier: schema link, SQL, fix SQL, answer</li><li>Provider switch: Anthropic (Haiku / Sonnet) or OpenAI via LLM_PROVIDER</li></ul></div>
  <div class="card"><h4>Limits</h4><ul><li>3 SQL attempts per turn</li><li>500 rows, 5 s timeout</li><li>1000 characters per message</li><li>Router confidence under 0.6 becomes “unclear”</li><li>3 earlier turns used for follow-ups</li></ul></div>
  <div class="card"><h4>Model calls per path (typed unless noted)</h4><ul><li>Saved question: 1</li><li>Data question: about 5 to 6</li><li>PO draft turn: 2</li><li>PO button or Confirm: 0</li><li>Blocked by rule: 0</li><li>Small talk: 2</li></ul></div>
</div>
<h2>Questions you may be asked</h2>
<div class="qa">
  <details><summary>Why not let one big agent with tools decide everything?</summary><p>Predictability and cost. The routing is mostly rules, the paths are fixed graphs, and each model call has one narrow job with its own task name, tier and trace. That makes failures easy to find in LangSmith and keeps simple requests fast.</p></details>
  <details><summary>How do you stop the model writing a dangerous query?</summary><p>It never executes anything itself. Its SQL passes a parser-based validator (single SELECT, allowed tables for the role, LIMIT cap), an EXPLAIN cost check, and then runs on a read-only connection with a timeout. Failures go back to the model with the exact error, at most three times.</p></details>
  <details><summary>How do you stop the model inventing numbers in the answer?</summary><p><code>check_answer</code> compares every number in the answer against the result, the question and the notes. If one is unknown, the answer is replaced by a template built straight from the data.</p></details>
  <details><summary>How is role-based access enforced?</summary><p>Capabilities per role in code. The schema shown to the model, the tables the validator allows, the saved questions on offer and PO creation are all filtered by role. PO creation is checked at the start and again on Confirm.</p></details>
  <details><summary>How does the PO flow keep state across turns?</summary><p>A draft row in <code>assistant.po_drafts</code>, loaded by <code>load_draft</code> and saved by <code>save_draft</code>. It also stores the last question asked and a queue of unresolved choices, so short answers are understood and nothing is dropped.</p></details>
  <details><summary>What happens when the model is down or returns junk?</summary><p>Each call site has a fallback: the guard falls back to rules, the router asks for clarification, the answer falls back to a template, small talk falls back to a fixed message. Outages are reported as a friendly error with a reference id that matches the LangSmith run.</p></details>
  <details><summary>How do you debug a bad answer?</summary><p>Open the trace in LangSmith. The tree shows each node, its type (agent, tool, LLM) and the inputs and outputs with rows removed and personal data masked. The run id is stored with the message, so thumbs-down feedback links to it.</p></details>
</div></div>`;

/* ---------- wiring ---------- */
if (typeof document !== "undefined") {
  const tabs = document.getElementById("tabs"), view = document.getElementById("view");
  document.getElementById("legend").innerHTML = Object.keys(TYPES).map((k) => `<div>${tag(k)} <span>${esc(TYPES[k].help)}</span></div>`).join("") +
    `<div><span class="st ran">RAN</span> executed on this turn</div><div><span class="st skip">SKIPPED</span> not executed, with the reason</div>`;
  const all = [...SCENARIOS.map((s, i) => ({ id: s.id, label: s.tab, n: i + 1 })), { id: "cheat-sheet", label: "Cheat sheet", n: "★" }];
  let current = all[0].id, vIndex = 0;
  const pick = (id) => { current = all.some((a) => a.id === id) ? id : all[0].id; vIndex = 0; draw(); };
  function draw() {
    tabs.innerHTML = all.map((a) => `<button class="tab" role="tab" id="tab-${a.id}" aria-selected="${a.id === current}" data-id="${a.id}"><span class="n">${a.n}</span>${esc(a.label)}</button>`).join("");
    if (current === "cheat-sheet") { view.innerHTML = CHEAT; return; }
    const sc = SCENARIOS.find((s) => s.id === current);
    const pills = sc.variants.length > 1 ? `<div class="pills" role="group" aria-label="Variants"><span class="pills-label">Scenario</span>${sc.variants.map((v, i) => `<button class="pill" aria-pressed="${i === vIndex}" data-v="${i}">${esc(v.label)}</button>`).join("")}</div>` : "";
    view.innerHTML = pills + variantHTML(sc.variants[vIndex]);
  }
  tabs.addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) { history.replaceState(null, "", "#" + b.dataset.id); pick(b.dataset.id); window.scrollTo({ top: 0 }); } });
  view.addEventListener("click", (e) => { const b = e.target.closest(".pill"); if (b) { vIndex = Number(b.dataset.v); draw(); } });
  window.addEventListener("hashchange", () => pick(location.hash.slice(1)));
  pick(location.hash.slice(1));
} else {
  const bad = []; SCENARIOS.forEach((s) => s.variants.forEach((v) => validate(v).forEach((p) => bad.push(`${s.id}/${v.label}: ${p}`))));
  console.log(bad.length ? bad.join("\n") : "all scenarios consistent");
}
</script>
